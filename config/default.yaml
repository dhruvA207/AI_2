# ARC base configuration.
#
# This file merges at the root of the config namespace; every other file in this
# directory merges under a key named after itself (policy.yaml -> `policy.*`).
#
# Override order, later winning:
#   1. this file
#   2. ~/.arc/config.yaml        (machine-local, never committed)
#   3. ARC_* environment vars    (ARC_RUNTIME__DRY_RUN=true -> runtime.dry_run)

runtime:
  # Log intended actions without executing them. Not a safety feature — a
  # development convenience, per the brief.
  dry_run: false
  session_name: arc

logging:
  # Level for the JSONL file.
  level: info
  to_file: true
  # The console stream stays quiet by default so CLI output is readable; the full
  # detail is always in the file.
  console: true
  console_level: warning

audit:
  enabled: true
  # fsync on every record costs a few ms per tool call. Off by default: data still
  # survives a process crash, only a kernel panic or power loss can lose the tail.
  fsync: false
  # Serialized values longer than this are clipped so one screenshot or file dump
  # cannot make the log unreadable.
  max_field_chars: 4000

voice:
  # How a voice turn is handled.
  #   local — Apple on-device recognition -> ARC's own model (memory + 28 tools) ->
  #           Gemini TTS. Keeps ARC as the brain. Measured ~4.3s to first audio, of
  #           which 2.7s is the separate TTS round-trip.
  #   live  — one Gemini Live WebSocket, native audio both ways, the way JARVIS works.
  #           No separate synthesis step, so far faster. But GEMINI ANSWERS, NOT ARC:
  #           the local model, memory and tools are bypassed, and your microphone
  #           audio streams to Google rather than staying on this Mac.
  # Measured: live 2.0s from you stopping to ARC speaking; local ~4.0s, of which 2.7s
  # is the separate TTS round-trip. Local is also mute right now — the REST TTS quota
  # is exhausted. Switch back to `local` to keep ARC's own model, memory and tools in
  # the loop, at the cost of speed.
  mode: live

  # Rests muted. The microphone is never opened at startup; ⌘S in the web UI (or
  # `arc voice listen`) is what opens it, and every session is written to the audit log.
  enabled: true

  # Recognition locale. Only en-US has an on-device speech asset on this machine —
  # en-GB and en-IN report "No Assistant asset for language" and would send your audio
  # to Apple's servers. Changing this away from en-US will be REFUSED while
  # require_on_device is true, which is the point: it fails loudly instead of quietly
  # going online.
  locale: en-US

  # Refuse to recognise at all if it cannot be done on this machine. ARC is
  # local-first; turning this off is your call, and it is the only way to use a
  # locale without an on-device asset.
  require_on_device: true

  # How ARC sounds. Gemini is the ONLY speech engine — the macOS voices were not good
  # enough and have been removed, so there is no local fallback.
  #
  # THIS IS THE ONE PART OF ARC THAT LEAVES THE MACHINE. The text ARC speaks is sent to
  # Google to be synthesised. Everything else — the model, memory, recognition — stays
  # on this Mac (§0). Every request is audited, and `arc voice status` says so outright.
  # Needs a key: GEMINI_API_KEY, or `gemini_api_key:` in config/secrets.yaml.
  #
  # Iapetus is the voice JARVIS uses. `arc voice status` lists every available name.
  voice: Iapetus
  model: gemini-2.5-flash-preview-tts

  # Stop speaking the moment you start. Without this you have to wait ARC out.
  barge_in: true

  # End-of-utterance detection. Apple only marks a result final when the audio stream
  # ends, so while the mic stays open you get partials forever and nothing ever fires.
  # ARC decides an utterance is over when the level stays within `speech_margin` of
  # the tracked room noise floor for `silence_ms`. Relative, not absolute: a fixed
  # threshold failed outright here, with 94% of samples above it in an ordinary room.
  # Raise silence_ms if it cuts you off mid-thought; raise speech_margin if background
  # noise keeps registering as speech.
  # 400 ms matches what JARVIS settled on. It was 900, which is a fifth of the whole
  # response time spent waiting to be sure you had stopped talking. Raise it if it
  # starts cutting you off mid-thought.
  silence_ms: 400
  speech_margin: 0.12

web:
  # BRIEF §4.4 asks ARC to respect robots.txt. Turning this off is your call to make —
  # §0.3 says ARC does not negotiate access on your behalf — but it stays on by
  # default, and google/bing search are unavailable while it is on because both
  # disallow /search.
  respect_robots: false

  # Minimum seconds between requests to the same host.
  rate_limit_delay: 1.0
  timeout: 20.0

  search:
    # Tried in order; the first backend to return results wins. Fallthrough is
    # deliberate — a backend returning nothing looks identical to a query with no
    # answers, so without it a broken backend makes ARC look ignorant rather than
    # broken.
    #
    # Measured 2026-07-29 with an honest (non-browser) user agent:
    #   bing        — UNRELIABLE for automated use. Returns HTTP 200 with paid ads
    #                 dressed as organic results once it classifies the client as a
    #                 bot: "unhashable type list" returned foxnews.com and
    #                 "Liskov her principle" returned brainyquote.com, both carrying
    #                 Microsoft's msockid= advertising click id. Occasional good hits
    #                 ("rust borrow checker") are entity matches that happen to
    #                 coincide. Condensing queries to keywords does not fix it.
    #   google      — NON-FUNCTIONAL. Serves a JavaScript shell to non-browsers: 3
    #                 links in the whole response, none of them results.
    #   duckduckgo  — works reliably across every query shape tested, and is the only
    #                 one whose robots.txt permits this.
    #
    # duckduckgo is first because it is the only backend that actually works. Bing was
    # requested as the default and tested hard for it — ~60 requests across four parser
    # revisions, ad filtering, and query condensation — and it could not be made
    # reliable. Reorder to [bing, duckduckgo] if you want bing tried first anyway; it
    # will usually return something plausible-looking and wrong.
    #
    # To drop duckduckgo entirely, a keyed search API (Brave, Serper, Tavily) is the
    # only route that works without impersonating a browser. Say the word and it is a
    # small backend to add. See docs/DECISIONS.md ADR-020.
    backends: [duckduckgo, bing]

    # Reduce natural-language questions to keywords before searching. Off by default:
    # it was built to rescue bing and did not, and duckduckgo handles natural language
    # better than keywords. See arc/web/search.py:condense.
    condense_queries: false
    keyword_limit: 3

    max_results: 8

  research:
    # Shallow by default: one search, a few pages, quick. This is what `arc research`
    # and the agent's web tools use.
    #
    # Research Mode (`arc research --deep`, or mode: deep here) decomposes the question
    # into several queries, reads more sources across multiple rounds, and scores every
    # claim by how many INDEPENDENT domains assert it. Far more accurate, and far
    # slower: on a local 4B model at ~14 tok/s, budget 1-3 minutes rather than seconds,
    # because claim extraction is one model call per page.
    mode: shallow

    # Shallow settings.
    max_pages: 3

    # Research Mode settings.
    deep:
      rounds: 2
      queries_per_round: 3
      pages_per_round: 4
      # Cosine similarity above which two differently-worded claims count as the same
      # assertion. Lower than memory's dedupe threshold on purpose: demanding near
      # identity would count real corroboration as two isolated single-source claims.
      corroboration_threshold: 0.86

memory:
  enabled: true
  # One SQLite file, no server, so the whole memory is a single backup-able artifact
  # that survives the macOS -> Windows move by being copied (BRIEF §4.2).
  # null means ~/.arc/memory.db
  path: null

  embedder:
    # BAAI/bge-small-en-v1.5 via ONNX Runtime. MIT, 33M params, CPU-only, and
    # cross-platform — MLX would be faster but exists only on Apple Silicon, and
    # Track A has to survive the Windows move. See docs/DECISIONS.md ADR-014.
    repo: BAAI/bge-small-en-v1.5
    dimension: 384
    max_tokens: 512

  retrieval:
    # How many memories to inject into a chat turn.
    limit: 6
    # Candidates each strategy contributes before fusion.
    per_strategy: 20
    # Reciprocal Rank Fusion weights. Vector leads because paraphrase is the common
    # case; recency is lowest because it is a tiebreaker, not evidence of relevance.
    weights:
      vector: 1.0
      keyword: 0.8
      graph: 0.7
      recency: 0.4

  working:
    # Tokens held back for the reply. The rest is split between the sections below.
    reserve_for_reply: 1024
    # Fractions of the usable window. They need not sum to 1.0; the remainder is
    # slack that stops a slightly-wrong token estimate becoming a failed generation.
    system: 0.10
    procedural: 0.10
    retrieved: 0.35
    history: 0.35

  consolidation:
    # Runs on demand via `arc memory consolidate`. Deliberately conservative: this
    # rewrites memories in the background, and being too timid costs disk while being
    # too aggressive destroys things silently. Turn these up once there is evidence
    # of what they do to a real corpus.
    enabled: true
    # Cosine similarity above which two memories are treated as the same thing.
    dedupe_threshold: 0.97
    # Daily salience multiplier for unretrieved memories; 0.99 halves in ~69 days.
    decay_per_day: 0.99
    prune_below: 0.05
    summarize_after_turns: 20
    promote_after: 3
    max_per_run: 500
    # Pruning permanently deletes. Decay is reversible; this is not.
    allow_prune: false

hardware:
  # Re-probe on startup rather than trusting a cached file. Cheap (~1s) and the
  # machine genuinely changes: external GPUs, memory pressure, OS upgrades.
  refresh_on_startup: true

  # Memory the OS and other applications need. On unified-memory machines the GPU
  # shares this pool, so a model that fits on paper will swap without this reserve.
  os_reserve_gb: 4.0
  os_reserve_fraction: 0.28

  # Rough resident cost of the other models ARC wants loaded, used to warn when they
  # will not co-reside with the main model. Refine these in Phase 2 and Phase 6 once
  # we have measured the real ones.
  vlm_estimate_gb: 4.0
  embedder_estimate_gb: 0.5

  # Warn when weights leave less than this much room for KV cache growth.
  min_headroom_gb: 2.0
